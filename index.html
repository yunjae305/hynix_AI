<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>AI 역량 모의시험</title>
<meta name="description" content="자료 파일을 AI에게 물어보며 푸는 실무형 AI 역량 모의시험">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233f6fd6'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='monospace' font-weight='700' font-size='14' fill='white'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<script>
// 화면이 그려지기 전에 테마를 정한다. 기본은 다크, 버튼으로 바꾼 선택이 저장돼 있으면 그것을 따른다
(function () {
  var t; try { t = localStorage.getItem('theme'); } catch (e) {}
  document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
})();
</script>
<style>
/* 편집기(IDE)풍 화면. 색·글꼴·간격은 모두 토큰으로 두고 테마만 바꾼다. 회색은 푸른 기가 도는 한 계열, 강조색은 파랑 하나. */
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1116;--side:#14171e;--bar:#0b0d11;--line:#232833;--ink:#c5cad6;--strong:#f2f4f8;--sub:#7f8798;
  --acc:#6b9bff;--btn:#3f6fd6;--btn-h:#4d7ce0;--sel:rgba(107,155,255,.14);--hover:rgba(255,255,255,.05);--input:#0b0d11;--input-line:#2a303c;
  --ok:#4cc38a;--bad:#f2777a;--bad-bg:rgba(242,119,122,.14);--lnum:#4a5162;--chip:#1c212b;--pat:rgba(255,255,255,.12);--zebra:rgba(255,255,255,.022)}
:root[data-theme=light]{color-scheme:light;--bg:#ffffff;--side:#f6f7f9;--bar:#eef0f4;--line:#e2e5eb;--ink:#353b47;--strong:#11141a;--sub:#6a7283;
  --acc:#2f5fd0;--btn:#2f5fd0;--btn-h:#274fb3;--sel:rgba(47,95,208,.09);--hover:rgba(15,20,30,.05);--input:#ffffff;--input-line:#cfd4dd;
  --ok:#1f8a5b;--bad:#c93a3a;--bad-bg:#fdecec;--lnum:#a3aab8;--chip:#eceff4;--pat:rgba(17,20,26,.11);--zebra:rgba(15,20,30,.022)}
:root{--ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"JetBrains Mono",Consolas,"SF Mono",Menlo,"D2Coding",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--r-s:6px;--r-m:10px;--r-l:14px}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button,.opt,.node,.gtab,.qn,.tb,input,textarea{transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease),transform .1s var(--ease)}
:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.mono{font-family:var(--mono)}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* 틀: 제목 표시줄 · 본문 · 상태 표시줄 */
.vs{height:100dvh;display:flex;flex-direction:column}
.titlebar{display:flex;align-items:center;gap:2px;height:42px;padding:0 6px 0 12px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.logo{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--btn);color:#fff;font:700 10px var(--mono);letter-spacing:-.02em}
.ttl{flex:1;min-width:0;text-align:center;font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
.tb{display:grid;place-items:center;width:34px;height:30px;border-radius:var(--r-s);color:var(--sub)}
.tb:hover{background:var(--hover);color:var(--strong)}
.tb:active{transform:scale(.94)}
:root[data-theme=dark] .i-moon,:root[data-theme=light] .i-sun{display:none}
.pbar{height:2px;background:transparent;flex:none;margin-top:-1px;position:relative;z-index:1}
.pbar b{display:block;height:100%;width:0;background:var(--acc);border-radius:0 2px 2px 0;transition:width .3s var(--ease)}
.statusbar{display:flex;gap:14px;align-items:center;height:26px;padding:0 12px;background:var(--bar);border-top:1px solid var(--line);color:var(--sub);font-size:11.5px;flex:none;white-space:nowrap;overflow:hidden}
.statusbar>span:first-child:not(:empty)::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:7px;vertical-align:1px}
.statusbar .sp{flex:1}

/* 공통 부품 */
.btn{background:var(--btn);color:#fff;padding:0 16px;min-height:36px;border-radius:8px;font-size:13px;font-weight:600}
.btn:hover{background:var(--btn-h)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--hover);color:var(--strong)}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.ft{width:8px;height:8px;border-radius:2.5px;background:var(--sub);flex:none;display:inline-block}
.ft[data-x=xlsx],.ft[data-x=csv]{background:#3fa56b}.ft[data-x=pdf]{background:#e0605a}.ft[data-x=png]{background:#9a7be8}.ft[data-x=md]{background:#5b8def}.ft[data-x=json]{background:#d3a73a}
.gtabs{display:flex;background:var(--side);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.gtab{display:flex;align-items:center;gap:8px;padding:0 14px;height:38px;white-space:nowrap;color:var(--sub);font-size:12.5px;border-right:1px solid var(--line);box-shadow:inset 0 -2px 0 transparent}
.gtab.on{background:var(--bg);color:var(--strong);box-shadow:inset 0 2px 0 var(--acc);margin-bottom:-1px;height:39px}
button.gtab:not(.on):hover{color:var(--ink);background:var(--hover)}
.scroll{flex:1;min-height:0;overflow:auto}
.qno{display:inline-block;color:var(--acc);font:600 11.5px var(--mono);letter-spacing:.02em}

/* 'AI' 글씨를 흩어 놓은 문양 배경(한 가지 색, 타일 반복). 시작 화면과 채팅 대화 영역에 쓴다. */

-15 227 365)' fill='none' stroke='black' stroke-width='1.4'%3EAI%3C/text%3E%3Ctext x='284' y='377' font-size='34' transform='rotate(-15 284 377)' fill='none' stroke='black' stroke-width='1.4'%3EAI%3C/text%3E%3Ctext x='365' y='379' font-size='13' transform='rotate(8 365 379)' fill='black'%3EAI%3C/text%3E%3C/svg%3E") center/420px 420px}

#pc.pattern::before{opacity:.45} /* 채팅 창은 대화 글자 뒤에 깔리므로 시작 화면보다 옅게 */

/* 시작 */
.editor{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.hero{flex:1;min-height:0;overflow-y:auto;display:flex;padding:56px 20px 32px;position:relative}
.hero-in{margin:auto;width:100%;max-width:580px;display:flex;flex-direction:column;align-items:center;text-align:center}
.credit{margin:18px 0 0;font-size:12px;color:var(--sub);animation:rise .6s .24s var(--ease) both}
/* 시험 전 알아야 할 사항 */
.notes{width:100%;margin-top:36px;padding:20px 22px;text-align:left;background:var(--side);border:1px solid var(--line);border-radius:var(--r-l);animation:rise .6s .16s var(--ease) both}
.notes h2{margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--sub)}
.notes dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 18px;margin:0;font-size:13.5px;line-height:1.65}
.notes dt{color:var(--strong);font-weight:600;white-space:nowrap}
.notes dd{margin:0;text-wrap:pretty}
.notes b{color:var(--bad);font-weight:600}
.corner{position:absolute;top:10px;right:10px;width:40px;height:40px}
.hero h1{margin:0 0 36px;font-size:clamp(34px,7.2vw,68px);font-weight:700;color:var(--strong);letter-spacing:-.045em;line-height:1.1;text-wrap:balance;animation:rise .6s var(--ease) both}
.start{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 22px;font-size:16px;font-weight:600;border-radius:var(--r-l)}
.hero .start{width:min(100%,280px);animation:rise .6s .08s var(--ease) both}

/* 결과 */
.page{max-width:820px;margin:0 auto;padding:44px 24px 64px}
.page>*{animation:rise .45s var(--ease) both}
.page h2{font-size:17px;font-weight:600;color:var(--strong);margin:44px 0 14px;letter-spacing:-.01em}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 40px;align-items:center}
.ring{position:relative;width:176px;height:176px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);stroke-width:7}
.ring .tr{stroke:var(--line)}
.ring .fg{stroke:var(--acc);transition:stroke-dashoffset 1s var(--ease)}
.score{font-size:54px;font-weight:700;line-height:1;color:var(--strong);letter-spacing:-.04em}
.score small{font-size:.36em;font-weight:500;color:var(--sub);letter-spacing:0}
.lead{font-size:13px;color:var(--sub);margin:6px 0 0;text-align:center}
.bars{display:grid;gap:2px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(64px,150px) 30px;gap:14px;align-items:center;padding:7px 0;font-size:13.5px}
.bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{height:6px;border-radius:6px;background:var(--line);display:block;overflow:hidden}
.bar i b{display:block;height:100%;border-radius:6px;background:var(--acc)}
.review{background:var(--side);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;margin:10px 0;font-size:14px}
.review .ok,.review .no{display:inline-block;font-size:11.5px;font-weight:700;border-radius:var(--r-s);padding:2px 8px;margin-right:8px}
.review .ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.review .no{color:var(--bad);background:var(--bad-bg)}
.review .qt{color:var(--strong);margin:10px 0 8px;font-weight:600;line-height:1.55;text-wrap:pretty}
.review p{margin:4px 0;color:var(--sub);font-size:13px;line-height:1.65;text-wrap:pretty}
.review p:first-of-type{color:var(--ink)}

/* 시험: 활동 표시줄 · 탐색기 · 편집기 · AI 채팅 */
.work{flex:1;min-height:0;display:flex}
.activity{width:46px;background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:8px;flex:none}
.ab{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r-m);color:var(--sub)}
.ab svg{width:19px;height:19px}
.ab:hover{background:var(--hover);color:var(--strong)}
.ab.on{color:var(--acc);background:var(--sel)}
.sidebar{width:var(--sw,232px);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.work.noside .sidebar{display:none}
.sh{padding:14px 16px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--sub)}
.tree{overflow:auto;flex:1;padding:0 6px 14px}
.node{display:flex;align-items:center;gap:8px;width:100%;min-height:28px;padding:3px 10px;border-radius:var(--r-s);text-align:left;font-size:13px}
.node:hover{background:var(--hover)}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n{font:11px var(--mono);color:var(--sub)}
.node.on{background:var(--sel);color:var(--strong);font-weight:600}
.node.file .nm{font-size:12px}
.grp{padding:12px 10px 4px;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--lnum);flex:none;transition:background-color .2s,box-shadow .2s}
.done .dot{background:var(--ok);box-shadow:none}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{display:none}
.main{flex:1;min-height:0;display:grid;position:relative;grid-template-columns:var(--cx,51%) minmax(0,1fr);grid-template-rows:var(--ry,46%) minmax(0,1fr)}
.panel{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.s0{grid-area:1/1/3/2;border-right:1px solid var(--line)}
.s1{grid-area:1/2/2/3;border-bottom:1px solid var(--line)}
.s2{grid-area:2/2/3/3}
.panel.drop{outline:2px solid var(--acc);outline-offset:-2px}
[draggable=true]{cursor:grab}
/* 창 경계선: 끌어서 크기 조절 */
.rz{position:absolute;z-index:3;touch-action:none;transition:background-color .15s .08s}
.rz:hover,.rz.drag{background:var(--acc)}
.rz.v{top:0;bottom:0;left:calc(var(--cx,51%) - 2px);width:4px;cursor:col-resize}
.rz.h{left:var(--cx,51%);right:0;top:calc(var(--ry,46%) - 2px);height:4px;cursor:row-resize}

.foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);background:var(--side);flex:none}

/* 전체화면 가림막 · 확인 창 */
.guard{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}

.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--bar) 80%,transparent)}
.modal .box{width:min(100%,380px);background:var(--side);border:1px solid var(--input-line);border-radius:var(--r-l);padding:22px;animation:rise .2s var(--ease) both}

/* 문제 */
.qtabs{gap:6px;padding:9px 14px;align-items:center}
.qn{flex:none;min-width:30px;height:30px;padding:0 6px;justify-content:center;border:0;border-radius:8px;font:500 12px var(--mono);color:var(--sub);box-shadow:inset 0 0 0 1px var(--line);position:relative}
.qn:not(.on):hover{color:var(--strong);box-shadow:inset 0 0 0 1px var(--sub);background:transparent}

.qn.on.done::after{content:"";position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--side)}
#qbox{padding:20px}
#qbox>*{max-width:760px;animation:rise .28s var(--ease) both}
.scn{padding:18px 20px;background:var(--side);border:1px solid var(--line);border-radius:var(--r-l)}
.scn h2{margin:0 0 8px;font-size:15px;font-weight:700;color:var(--strong);letter-spacing:-.01em}
.scn p{margin:0;font-size:14px;line-height:1.75;white-space:pre-line;text-wrap:pretty}
.q{padding:26px 2px 8px}
.q h3{margin:8px 0 18px;font-size:17px;line-height:1.6;font-weight:600;color:var(--strong);letter-spacing:-.01em;text-wrap:pretty}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px;min-height:48px;margin:8px 0;border-radius:var(--r-m);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px}

.opt.on{background:var(--sel);box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--strong)}
.opt.on k{background:var(--btn);color:#fff}
.q input{width:100%;padding:0 14px;height:48px;background:var(--input);border:0;box-shadow:inset 0 0 0 1px var(--input-line);border-radius:var(--r-m);font-size:15px}
.q input:hover,.send textarea:hover{box-shadow:inset 0 0 0 1px var(--sub)}

::placeholder{color:var(--lnum)}

/* 파일 보기 */
#fv{padding:0}
.code{counter-reset:ln;font:12.5px/1.7 var(--mono);padding:10px 0 20px;min-width:100%;width:max-content}
.code .l{counter-increment:ln;position:relative;padding:0 18px 0 60px;white-space:pre}
.code .l:hover{background:var(--hover)}

.code.wrap{width:auto}.code.wrap .l{white-space:pre-wrap;word-break:break-word}
.sheet table{border-collapse:separate;border-spacing:0;font:12.5px var(--mono);white-space:nowrap}

.sheet tr:hover td{background:var(--hover)}
.shotbox{overflow:auto;background:#fff;margin:14px;border-radius:var(--r-m);border:1px solid var(--line)}
.shot{display:block;width:max(100%,640px)} /* 좁은 화면에서도 글자가 읽히도록 최소 폭을 두고 좌우로 민다 */

/* AI 채팅 */
.ph{display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--sub);background:var(--side);border-bottom:1px solid var(--line);flex:none}
.msgs{flex:1;min-height:0;overflow:auto;padding:10px 0;display:flex;flex-direction:column}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 16px;animation:rise .25s var(--ease) both}
.msg .who{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 10.5px var(--mono);background:var(--chip);color:var(--sub)}
.msg.ai .who{background:var(--btn);color:#fff}
.msg .tx{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;padding-top:3px;min-width:0}
.msg.me .tx{color:var(--strong)}
.msg .at{background:var(--sel);color:var(--acc);border-radius:5px;padding:1px 5px;font-size:12px}
.wait{padding:10px 16px 10px 56px;color:var(--sub);font-size:13px}
.wait i{display:inline-block;width:5px;height:5px;margin-right:4px;border-radius:50%;background:var(--sub);animation:blink 1.2s infinite}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
.att{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px 0;font-size:12px;flex:none}
.att[hidden]{display:none}
.att span{background:var(--chip);border-radius:var(--r-s);padding:3px 8px}
.att span b{color:var(--strong);font-weight:600;margin-left:4px}
.meter{width:100%;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .25s var(--ease),background-color .2s}
.att em{font-style:normal;color:var(--sub);width:100%;font-size:11.5px}
.att.over em{color:var(--bad);font-weight:600}
.att.over span{background:var(--bad-bg)}
.att.over .meter b{background:var(--bad)}
.composer{position:relative;flex:none;border-top:1px solid var(--line);background:var(--bg)}
.send{display:flex;gap:8px;padding:10px 14px 14px;flex:none}
.send textarea{flex:1;resize:none;height:58px;padding:10px 12px;background:var(--input);border:0;box-shadow:inset 0 0 0 1px var(--input-line);border-radius:var(--r-m);font-size:14px;line-height:1.45}
.send .btn{align-self:stretch;border-radius:var(--r-m);min-width:64px}
.pop{position:absolute;left:14px;right:14px;bottom:calc(100% + 6px);padding:5px;background:var(--side);border:1px solid var(--input-line);border-radius:var(--r-m);z-index:4}

.pop button:hover,.pop button:focus-visible{background:var(--sel);color:var(--strong)}
.pop small{color:var(--sub);margin-left:auto;font-size:11px}

@media (max-width:1100px){.sidebar,.rz.s{display:none}}
@media (max-width:860px){
  .activity{display:none}
  .titlebar{height:48px}.tb{height:40px;width:42px}
  .tabs{display:flex;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:6px 8px;gap:4px}
  .tabs button{flex:1;height:36px;border-radius:8px;color:var(--sub);font-size:13.5px;font-weight:500}
  .tabs button.on{background:var(--bg);color:var(--strong);font-weight:600;box-shadow:0 0 0 1px var(--line)}
  .main{display:block}
  .panel{display:none;height:100%;border:0}
  .panel.on{display:flex}
  .rz{display:none}
  .gtab{height:44px}.gtab.on{height:45px}
  .qtabs{padding:8px 12px}
  .qn{min-width:38px;height:38px;font-size:13px}.qn.on,.qn.on.done{height:38px}
  #qbox{padding:14px}
  .foot{justify-content:space-between;padding:10px 12px}.foot .btn{min-height:46px;flex:1}
  .q input,.send textarea{font-size:16px} /* iOS가 입력창을 확대하지 않도록 */
  .pop button{min-height:44px}
  .page{padding:28px 16px 44px}
  .hero{padding:64px 16px 28px}
  .notes{padding:18px}
  .notes dl{grid-template-columns:1fr;gap:2px}
  .notes dd{margin-bottom:12px}.notes dd:last-child{margin-bottom:0}
  .sum{grid-template-columns:1fr;justify-items:center;gap:24px}
  .bars{width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
const TOTAL = BUNDLES.length * 3;
const LIMIT = 20000; // 질문 한 번에 보낼 수 있는 토큰(서버 api/chat.js의 MAX_INPUT_TOKENS와 같은 값)
const fmt = (n) => n.toLocaleString('ko-KR');

// ───────── AI 연결 지점. 키는 서버(api/chat.js)에만 있고, 여기서는 대화만 보낸다.
// 글자 파일과 엑셀(표 내용)은 텍스트로, PDF·이미지는 원본 그대로 AI에 전달한다.
// ponytail: 이미지는 PNG만 가정. JPG 등을 쓰게 되면 확장자로 media_type을 고를 것.
const MEDIA = { pdf: ['document', 'application/pdf'], image: ['image', 'image/png'] };
const b64Cache = {};
const toBase64 = (url) => b64Cache[url] ??= fetch(url)
  .then((r) => { if (!r.ok) throw new Error('첨부파일을 불러오지 못했습니다.'); return r.blob(); })
  .then((blob) => new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onload = () => ok(fr.result.split(',')[1]);
    fr.onerror = () => no(new Error('첨부파일을 읽지 못했습니다.'));
    fr.readAsDataURL(blob);
  }))
  .catch((e) => { delete b64Cache[url]; throw e; });

// 질문 { text, files:[파일명] } 을 API 메시지로 바꾼다
async function toApi(m, files) {
    const blocks = [];
  for (const f of (m.files || []).map((n) => files.find((x) => x.name === n)).filter(Boolean)) {
    if (MEDIA[f.kind]) {
      const [type, media_type] = MEDIA[f.kind];
      blocks.push({ type: 'text', text: `[첨부파일: ${f.name}]` }, { type, source: { type: 'base64', media_type, data: await toBase64(f.url) } });
    } else blocks.push({ type: 'text', text: `<file name="${f.name}">\n${f.body}\n</file>` });
  }
  return { role: 'user', content: [...blocks, { type: 'text', text: m.text }] };
}
// 원샷: 이번 질문 하나만 보낸다. 이전 질문·답은 화면에만 남고 AI에는 전달되지 않는다.
async function askAI(question, files) {
  if (location.protocol === 'file:') { // 파일을 직접 열었을 때는 서버가 없으므로 데모 응답
    return '[데모 응답] 파일을 직접 열어 AI 서버가 없습니다.\n전달될 파일: ' + (question.files.join(', ') || '없음');
  }
  const r = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ messages: [await toApi(question, files)] }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `AI 서버 오류 (${r.status})`);
  return data.reply;
}

// ───────── 채점
const norm = (s) => String(s ?? '').toLowerCase().replace(/\s+/g, '');
function isCorrect(q, a) {
  if (q.type === 'mc') return a === q.answer;
  return a != null && norm(a) !== '' && q.answers.some((x) => norm(x) === norm(a));
}
console.assert(isCorrect({ type: 'short', answers: ['박준'] }, '  박 준 '), '공백 무시');
console.assert(isCorrect({ type: 'short', answers: ['GPT'] }, 'gpt'), '대소문자 무시');
console.assert(!isCorrect({ type: 'short', answers: ['3'] }, ''), '빈 답은 오답');
console.assert(!isCorrect({ type: 'mc', answer: 1 }, undefined), '미응답은 오답');

// ───────── 상태
// 시험 중 화면을 벗어나면(전체화면 해제 · 탭 전환 · 창 전환) 한 번에 3점 감점, 누적 21점이면 자동 탈락
const PENALTY = 3, FAIL_AT = 21;
const fresh = () => ({ screen: 'home', q: 0, b: 0, tab: 'q', exits: 0, inFull: false, warn: false, lastV: 0, answers: {}, chats: BUNDLES.map(() => []), drafts: BUNDLES.map(() => ''), file: BUNDLES.map(() => 0) });
let S = fresh();
// 새로고침·탭 전환으로 답이 사라지지 않도록 세션에 저장해 둔다
const SAVE_KEY = 'ai-exam-mock-v6';
try {
  const saved = JSON.parse(sessionStorage.getItem(SAVE_KEY));
  if (saved && saved.chats?.length === BUNDLES.length && saved.q < TOTAL) S = saved;
} catch (e) { /* 저장소를 못 쓰는 환경이면 새로 시작 */ }
const penalty = () => S.exits * PENALTY;
// 전체화면 상태에서 새로고침하면 전체화면이 풀리므로 이탈 1회로 센다(새로고침 직전에 탭 숨김으로 이미 셌으면 다시 세지 않는다)
if (S.screen === 'exam' && S.inFull) {
  S.inFull = false;
  if (Date.now() - S.lastV > 3000) { S.exits++; S.warn = true; }
  if (penalty() >= FAIL_AT) S.screen = 'result';
}
const save = () => {
  const inp = document.getElementById('inp');
  if (inp) S.drafts[S.b] = inp.value;
  try { sessionStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 실패는 시험 진행을 막지 않는다 */ }
};
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => document.hidden && save());
const app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const answered = () => Object.values(S.answers).filter((v) => v !== '' && v != null).length;
const ext = (name) => name.split('.').pop();

// ───────── 창 배치: 경계선을 끌어 크기를 바꾸고, 창 머리줄을 다른 창에 끌어다 놓아 자리를 맞바꾼다
// order = [왼쪽, 오른쪽 위, 오른쪽 아래]에 놓일 창. cx·ry = 세로·가로 경계 위치(%), sw = 탐색기 폭(px)
const LAYOUT0 = { cx: 51, ry: 46, sw: 232, order: ['pq', 'pf', 'pc'] };
const L = { ...LAYOUT0, order: [...LAYOUT0.order] };
try {
  const saved = JSON.parse(localStorage.getItem('layout'));
  if (saved && [...saved.order].sort().join() === 'pc,pf,pq' && [saved.cx, saved.ry, saved.sw].every(Number.isFinite)) Object.assign(L, saved);
} catch (e) { /* 저장된 배치가 없거나 깨졌으면 기본 배치 */ }
const saveLayout = () => { try { localStorage.setItem('layout', JSON.stringify(L)); } catch (e) { /* 저장 못 해도 이번 화면에는 적용된다 */ } };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// ───────── 테마 · 전체화면
const ICON = {
  sun: '<svg class="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>',
  moon: '<svg class="i-moon" viewBox="0 0 16 16"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/></svg>',
  x: '<svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>',
  files: '<svg viewBox="0 0 16 16"><path d="M5.5 4.5V2.5h5l3 3v6h-2.5M2.5 4.5h5l3 3v6h-8z"/></svg>',
  play: '<svg viewBox="0 0 16 16"><path d="M4.5 2.8l8 5.2-8 5.2z" fill="currentColor"/></svg>',
};
const canFull = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
// 폰·태블릿(터치 전용 기기)은 전체화면을 쓰지 않는다. 탭·앱 전환 감지만 적용한다.
const useFull = canFull && !matchMedia('(hover: none) and (pointer: coarse)').matches;
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function enterFull() { // 끝나면 풀리는 약속을 돌려준다. 미지원·거부여도 오류를 내지 않는다
  const el = document.documentElement;
  try { return Promise.resolve((el.requestFullscreen || el.webkitRequestFullscreen)?.call(el)).catch(() => {}); } catch (e) { return Promise.resolve(); }
}
function exitFull() {
  if (!isFull()) return;
  try { Promise.resolve((document.exitFullscreen || document.webkitExitFullscreen)?.call(document)).catch(() => {}); } catch (e) { /* 미지원 */ }
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) { /* 저장 못 해도 이번 화면에는 적용된다 */ }
}
async function startExam() {
  S = fresh(); S.screen = 'exam'; S.lastV = Date.now(); // 시작 직후 화면 전환 중에 생기는 신호는 이탈로 세지 않는다
  if (useFull) await enterFull();
  S.inFull = isFull(); render();
}
function goHome() { S = fresh(); exitFull(); render(); }

// 가림막: 전체화면이 아니거나(PC) 화면 이탈이 감지된 직후에 시험 화면을 가리고 누적 감점을 보여준다
function syncGuard() {
  const g = document.getElementById('guard'); if (!g) return;
  const needFull = useFull && !isFull();
  g.hidden = !(needFull || S.warn);
  g.querySelector('h2').textContent = needFull ? '전체화면에서만 응시할 수 있습니다' : '시험 화면을 벗어났습니다';
  g.querySelector('button').textContent = needFull ? '전체화면으로 돌아가기' : '시험으로 돌아가기';
  document.getElementById('guardMsg').textContent = S.exits ? `화면 이탈 ${S.exits}회 · 감점 ${penalty()}점 (누적 ${FAIL_AT}점이면 탈락)` : '';
  document.getElementById('pen').textContent = S.exits ? `화면 이탈 ${S.exits}회 · −${penalty()}점` : '';
}
// 이탈 1회 기록. 한 번의 이탈이 여러 신호(창 포커스 잃음 · 탭 숨김 · 전체화면 해제)로 겹쳐 들어오므로 짧은 시간 안의 중복은 버린다.
function violate() {
  if (S.screen !== 'exam') return;
  const now = Date.now();
  if (now - S.lastV < 1500) return;
  S.lastV = now; S.exits++; S.warn = true;
  if (penalty() >= FAIL_AT) { save(); S.screen = 'result'; exitFull(); render(); save(); return; }
  save(); syncGuard();
}
// 전체화면 해제(Esc 등). 제출·나가기로 풀리는 것은 시험 화면이 아니므로 세지 않는다.
function onFullChange() {
  if (S.screen !== 'exam') return;
  if (isFull()) S.inFull = true;
  else if (S.inFull) { S.inFull = false; violate(); }
  if (S.screen === 'exam') { save(); syncGuard(); }
}
document.addEventListener('fullscreenchange', onFullChange);
document.addEventListener('webkitfullscreenchange', onFullChange);
// 탭 전환 · 창 전환(다른 프로그램, 다른 앱). 돌아올 때까지는 한 번으로 센다.
let away = false;
const leftView = () => { if (!away) { away = true; violate(); } };
const backToView = () => { if (!document.hidden && document.hasFocus()) away = false; };
addEventListener('blur', leftView);
addEventListener('focus', backToView);
document.addEventListener('visibilitychange', () => (document.hidden ? leftView() : backToView()));
// 가림막의 돌아가기 버튼
async function resumeExam() {
  S.warn = false; S.lastV = Date.now();
  if (useFull && !isFull()) await enterFull();
  save(); syncGuard();
}

// 화면 안 확인 창. 브라우저 기본 확인 창은 전체화면을 풀어 버리므로 쓰지 않는다.
function ask(message, okLabel) {
  return new Promise((done) => {
    const d = document.createElement('div');
    d.className = 'modal';
    d.innerHTML = `<div class="box" role="alertdialog" aria-modal="true"><p>${esc(message)}</p><div class="row"><button class="btn ghost" data-v="0">취소</button><button class="btn" data-v="1">${esc(okLabel)}</button></div></div>`;
    d.addEventListener('click', (e) => { const v = e.target.closest('[data-v]')?.dataset.v; if (v == null) return; d.remove(); done(v === '1'); });
    document.body.append(d);
    d.querySelector('[data-v="1"]').focus();
  });
}
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'theme') toggleTheme();
  if (act === 'full') resumeExam();
  if (act === 'start') startExam();
  if (act === 'home') goHome();
});

// 제목 표시줄 · 본문 · 상태 표시줄로 된 공통 틀
function shell(title, body, status) {
  return `<div class="vs">
    <header class="titlebar"><span class="logo" aria-hidden="true">AI</span><span class="ttl">${esc(title)}</span>
      <button class="tb" data-act="theme" aria-label="라이트 모드/다크 모드 전환" title="라이트/다크 전환">${ICON.sun}${ICON.moon}</button>
      ${S.screen === 'exam' ? `<button class="tb" id="quit" aria-label="시험 나가기" title="나가기">${ICON.x}</button>` : ''}
    </header>
    <div class="pbar"><b id="pb"></b></div>
    ${body}
    <footer class="statusbar">${status}</footer>
  </div>`;
}
const page = (tab, x, inner) => `<main class="editor"><div class="gtabs"><span class="gtab on"><i class="ft" data-x="${x}"></i>${tab}</span></div><div class="scroll"><div class="page">${inner}</div></div></main>`;

function render() {
  app.innerHTML = { home, exam, result }[S.screen]();
  if (S.screen === 'exam') bindExam();
}

function home() { // 표시줄 없이 제목, 응시하기 버튼, 시험 전 안내. 테마 버튼은 구석에 둔다.
  const leave = useFull ? '전체화면 해제(Esc) · 새로고침 · 탭 전환 · 다른 창으로 이동' : '탭 전환 · 다른 앱으로 이동';
  const also = useFull ? '주소창을 누르거나 찾기(Ctrl+F) 창을 여는 것' : '주소창을 누르거나 알림 창을 내리는 것';
  return `<div class="vs"><main class="editor pattern"><div class="hero">
    <button class="tb corner" data-act="theme" aria-label="라이트 모드/다크 모드 전환" title="라이트/다크 전환">${ICON.sun}${ICON.moon}</button>
    <div class="hero-in">
      <h1>AI 역량 모의시험</h1>
      <button class="btn start" data-act="start">${ICON.play}응시하기</button>
      <section class="notes" aria-labelledby="notesTitle">
        <h2 id="notesTitle">시험 전 알아야 할 사항</h2>
        <dl>
          <dt>문제</dt><dd>${TOTAL}문제입니다. 현업 상황 ${BUNDLES.length}개에 각각 객관식 1문제와 단답형 2문제가 딸려 있습니다. 번호를 눌러 자유롭게 오갈 수 있고, 제출하면 한꺼번에 채점됩니다.</dd>
          <dt>AI 채팅</dt><dd>첨부파일을 @로 멘션해 AI에게 물어보며 풉니다. AI는 질문마다 기억이 초기화되므로, 앞에서 얻은 결과는 다음 질문에 직접 적어 넣어야 합니다.</dd>
          <dt>토큰 제한</dt><dd>질문과 첨부파일을 합쳐 한 번에 ${fmt(LIMIT)}토큰까지 보낼 수 있습니다. 자료가 커서 한꺼번에 보낼 수 없으니 질문을 나눠야 합니다.</dd>
          ${useFull ? '<dt>전체화면</dt><dd>응시하기를 누르면 전체화면으로 시작하며, 전체화면에서만 응시할 수 있습니다.</dd>' : ''}
          <dt>감점</dt><dd>시험 중 화면을 벗어나면 <b>1회당 ${PENALTY}점 감점</b>, 누적 ${FAIL_AT}점이면 <b>자동 탈락</b>입니다. ${leave}이 해당합니다. ${also}도 이탈로 감지될 수 있습니다.</dd>
        </dl>
      </section>
      <p class="credit">SK Hynix의 해커톤을 참고해서 만들었습니다.</p>

  </div></main></div>`;
}

function exam() {
  const B = BUNDLES[S.b];
  return shell(`${B.title} — AI 역량 모의시험`, `<div class="guard" id="guard" hidden><h2></h2><p id="guardMsg"></p><button class="btn start" data-act="full"></button></div>
  <div class="work">
    <nav class="activity" aria-label="보기 전환">

      <div class="tabs" role="tablist">${[['q', '문제'], ['f', '파일'], ['c', 'AI 채팅']].map(([k, t]) => `<button role="tab" data-tab="${k}">${t}</button>`).join('')}</div>
      <div class="main">

function bindExam() {
  const B = BUNDLES[S.b], $ = (id) => document.getElementById(id);
  const inp = $('inp'), pop = $('pop'), msgs = $('msgs');
  const Q = (n) => BUNDLES[Math.floor(n / 3)].questions[n % 3];
  const qid = (n) => `${Math.floor(n / 3)}-${n % 3}`;
  const isDone = (n) => { const v = S.answers[qid(n)]; return v !== '' && v != null; };

  // 답한 문제 표시(번호 탭 · 탐색기)와 맨 위 진행 선
  const progress = () => {
    $('pb').style.width = (answered() / TOTAL * 100) + '%';
    document.querySelectorAll('[data-go]').forEach((el) => el.classList.toggle('done', isDone(+el.dataset.go)));
  };
  const setTab = (t) => {
    S.tab = t;
    document.querySelectorAll('.tabs button').forEach((b) => { const on = b.dataset.tab === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    ['pq', 'pf', 'pc'].forEach((id) => $(id).classList.toggle('on', id === 'p' + t));
  };
  // 지금 문제: 맨 위에 상황(보기), 그 아래 문제 하나
  const drawQ = () => {
    const n = S.q, q = Q(n), a = S.answers[qid(n)];
    const body = q.type === 'mc'
      ? q.options.map((o, k) => `<button class="opt ${a === k ? 'on' : ''}" data-q="${qid(n)}" data-k="${k}" aria-pressed="${a === k}"><k>${'ABCD'[k]}</k><span>${esc(o)}</span></button>`).join('')
      : `<input data-q="${qid(n)}" value="${esc(a ?? '')}" placeholder="답을 입력하세요" autocomplete="off" aria-label="단답형 답">`;
    $('qbox').innerHTML = `<div class="scn"><h2>${esc(B.title)}</h2>${B.scenario ? `<p>${esc(B.scenario)}</p>` : ''}</div>
      <div class="q"><span class="qno">문제 ${n + 1}</span><h3>${esc(q.text)}</h3>${body}</div>`;
    $('qbox').scrollTop = 0;
    $('qtabs').innerHTML = Array.from({ length: TOTAL }, (_, i) => `<button class="gtab qn ${i === n ? 'on' : ''}" data-go="${i}" aria-label="문제 ${i + 1}" ${i === n ? 'aria-current="true"' : ''}>${i + 1}</button>`).join('');
    $('qtabs').querySelector('.on').scrollIntoView({ block: 'nearest', inline: 'nearest' });
    document.querySelectorAll('#tree [data-go]').forEach((el) => el.classList.toggle('on', +el.dataset.go === n));
    $('prev').disabled = n === 0;
    $('next').textContent = n === TOTAL - 1 ? '제출하기' : '다음 문제';
    progress();
  };
  // 문제 이동. 같은 상황 안에서는 파일·채팅 화면을 그대로 두고 문제만 바꾼다.
  const go = (n) => {
    if (n < 0 || n >= TOTAL) return;
    const sameScene = Math.floor(n / 3) === S.b;
    leave(); S.q = n; S.b = Math.floor(n / 3); S.tab = 'q';
    if (sameScene) { setTab('q'); drawQ(); } else render();
  };
  // 탐색기: 문제 1~15(상황별로 묶어 표시)와 지금 상황의 첨부파일
  const drawTree = () => {
    $('tree').innerHTML = `<div class="sh">문제</div>` + BUNDLES.map((X, bi) => `<div class="grp">${esc(X.title)}</div>` +
      X.questions.map((_, qi) => { const n = bi * 3 + qi; return `<button class="node qnode" data-go="${n}"><span class="dot"></span><span class="nm">문제 ${n + 1}</span></button>`; }).join('')).join('') +
      `<div class="sh">첨부파일</div>` + B.files.map((f, k) => `<button class="node file" data-f="${k}"><i class="ft" data-x="${ext(f.name)}"></i><span class="nm mono">${esc(f.name)}</span><span class="n">${fmt(f.tokens)}</span></button>`).join('');
  };
  const showFile = (i) => {
    S.file[S.b] = i;
    $('files').innerHTML = B.files.map((f, k) => `<button class="gtab chip mono ${k === i ? 'on' : ''}" data-f="${k}"><i class="ft" data-x="${ext(f.name)}"></i>${esc(f.name)}</button>`).join('');
    document.querySelectorAll('#tree .file').forEach((n) => n.classList.toggle('on', +n.dataset.f === i));
    const f = B.files[i];
    if (f.kind === 'image' || f.kind === 'pdf') { // PDF는 모바일에서 바로 안 보이는 경우가 많아 미리보기 이미지로 보여준다
      $('fv').innerHTML = `<div class="shotbox" tabindex="0"><img class="shot" src="${esc(f.preview || f.url)}" alt="${esc(f.name)} 미리보기"></div>`;
    } else if (f.kind === 'sheet') {
      const rows = f.body.split('\n').map((l) => l.split(','));
      $('fv').innerHTML = `<div class="sheet"><table>${rows.map((r, k) => `<tr>${r.map((c) => (k ? `<td>${esc(c)}</td>` : `<th>${esc(c)}</th>`)).join('')}</tr>`).join('')}</table></div>`;
    } else { // 줄 번호가 붙은 코드 보기. 표(CSV)만 가로 스크롤, 나머지 글자 파일은 줄바꿈
      $('fv').innerHTML = `<div class="code${f.name.endsWith('.csv') ? '' : ' wrap'}">${f.body.split('\n').map((l) => `<div class="l">${esc(l) || ' '}</div>`).join('')}</div>`;
    }
    $('fv').scrollTop = 0;
  };
  const drawMsgs = (waiting) => {
    const list = S.chats[S.b];
    msgs.innerHTML = (list.length
      ? list.map((m) => `<div class="msg ${m.who}"><span class="who" aria-hidden="true">${m.who === 'me' ? '나' : 'AI'}</span><div class="tx">${esc(m.text).replace(/@([^\s@]+)/g, (all, n) => B.files.some((f) => f.name === n) ? `<span class="at mono">@${n}</span>` : all)}</div></div>`).join('')
      : '') + (waiting ? `<div class="wait" role="status" aria-label="답변을 만드는 중"><i></i><i></i><i></i></div>` : '');
    msgs.scrollTop = msgs.scrollHeight;
  };
  const leave = () => { S.drafts[S.b] = inp.value; };

  // 문제 답
  $('pq').addEventListener('click', (e) => {
    const o = e.target.closest('.opt'); if (!o) return;
    S.answers[o.dataset.q] = +o.dataset.k;
    document.querySelectorAll(`.opt[data-q="${o.dataset.q}"]`).forEach((x) => { const on = x === o; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
    progress();
  });
  $('pq').addEventListener('input', (e) => { if (e.target.dataset.q) { S.answers[e.target.dataset.q] = e.target.value; progress(); } });

  // 문제 번호 · 탭 · 파일 · 탐색기
  $('qtabs').addEventListener('click', (e) => { const t = e.target.closest('[data-go]'); if (t) go(+t.dataset.go); });
  document.querySelector('.tabs').addEventListener('click', (e) => e.target.dataset.tab && setTab(e.target.dataset.tab));
  $('files').addEventListener('click', (e) => { const t = e.target.closest('[data-f]'); if (t) showFile(+t.dataset.f); });
  $('tree').addEventListener('click', (e) => {
    const f = e.target.closest('[data-f]'), g = e.target.closest('[data-go]');
    if (f) return showFile(+f.dataset.f);
    if (g) go(+g.dataset.go);
  });
  $('abSide').onclick = () => $('abSide').classList.toggle('on', !document.querySelector('.work').classList.toggle('noside'));

  // 입력창에 멘션된 파일과 토큰 크기를 보여준다. 질문 글의 토큰은 서버에서만 정확히 셀 수 있어 합계에서 뺀다.
  const drawAtt = () => {
    const files = B.files.filter((f) => inp.value.includes('@' + f.name));
    const sum = files.reduce((s, f) => s + f.tokens, 0);
    $('att').hidden = !files.length;
    $('att').classList.toggle('over', sum > LIMIT);
    $('att').innerHTML = files.map((f) => `<span class="mono">${esc(f.name)} <b>${fmt(f.tokens)}</b></span>`).join('') +
      `<div class="meter"><b style="width:${Math.min(100, sum / LIMIT * 100)}%"></b></div><em>첨부 합계 ${fmt(sum)} / ${fmt(LIMIT)} 토큰${sum > LIMIT ? ' · 한도 초과' : ''}</em>`;
  };

  // @멘션: 커서 앞이 "@글자"로 끝나면 이 상황의 파일만 후보로 띄운다
  const mention = () => {
    const m = inp.value.slice(0, inp.selectionStart).match(/@([^\s@]*)$/);
    const hits = m ? B.files.filter((f) => f.name.toLowerCase().includes(m[1].toLowerCase())) : [];
    pop.hidden = !hits.length;
    pop.innerHTML = hits.map((f) => `<button type="button" class="mono" data-n="${esc(f.name)}"><i class="ft" data-x="${ext(f.name)}"></i>@${esc(f.name)} <small>${fmt(f.tokens)}토큰</small></button>`).join('');
    drawAtt();
  };
  inp.addEventListener('input', mention);
  pop.addEventListener('click', (e) => {
    const n = e.target.closest('button')?.dataset.n; if (!n) return;
    const at = inp.selectionStart, head = inp.value.slice(0, at).replace(/@[^\s@]*$/, '@' + n + ' ');
    inp.value = head + inp.value.slice(at);
    inp.focus(); inp.setSelectionRange(head.length, head.length); pop.hidden = true; drawAtt();
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') pop.hidden = true;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('send').requestSubmit(); }
  });

  // 전송
  $('send').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = inp.value.trim(); if (!text) return;
    const b = S.b, chat = S.chats[b];
    const files = B.files.filter((f) => text.includes('@' + f.name));
    chat.push({ who: 'me', text, files: files.map((f) => f.name) }); inp.value = ''; pop.hidden = true; drawMsgs(true); drawAtt();
    $('go').disabled = true;
    try { chat.push({ who: 'ai', text: await askAI(chat.at(-1), B.files) }); }
    catch (err) { chat.push({ who: 'ai', text: err.message || '응답을 받지 못했습니다. 다시 시도해 주세요.' }); console.error(err); }
    if (S.screen === 'exam' && S.b === b) { drawMsgs(); document.getElementById('go').disabled = false; }
  });

  // 창 배치 적용과 조절
  const main = document.querySelector('.main'), work = document.querySelector('.work');
  const applyLayout = () => {
    L.order.forEach((id, i) => { $(id).classList.remove('s0', 's1', 's2'); $(id).classList.add('s' + i); });
    main.style.setProperty('--cx', L.cx + '%'); main.style.setProperty('--ry', L.ry + '%'); work.style.setProperty('--sw', L.sw + 'px');
  };
  document.querySelectorAll('.rz').forEach((h) => {
    const k = h.dataset.rz;
    h.onpointerdown = (e) => {
      e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add('drag');
      h.onpointermove = (m) => {
        const r = main.getBoundingClientRect();
        if (k === 'cx') L.cx = clamp((m.clientX - r.left) / r.width * 100, 20, 80);
        if (k === 'ry') L.ry = clamp((m.clientY - r.top) / r.height * 100, 15, 85);
        if (k === 'sw') L.sw = clamp(m.clientX - document.querySelector('.sidebar').getBoundingClientRect().left, 150, 480);
        applyLayout();
      };
      h.onpointerup = h.onpointercancel = () => { h.onpointermove = null; h.classList.remove('drag'); saveLayout(); };
    };
    h.ondblclick = () => { L[k] = LAYOUT0[k]; applyLayout(); saveLayout(); }; // 두 번 누르면 기본 크기로
  });
  let dragId = null;
  main.addEventListener('dragstart', (e) => {
    dragId = e.target.closest?.('[data-drag]')?.dataset.drag || null;
    if (dragId) { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; }
  });
  const clearDrop = () => document.querySelectorAll('.panel.drop').forEach((p) => p.classList.remove('drop'));
  main.addEventListener('dragover', (e) => {
    const p = e.target.closest('.panel');
    if (!dragId || !p || p.id === dragId) return;
    e.preventDefault(); clearDrop(); p.classList.add('drop');
  });
  main.addEventListener('drop', (e) => {
    const p = e.target.closest('.panel');
    if (!dragId || !p || p.id === dragId) return;
    e.preventDefault();
    const a = L.order.indexOf(dragId), b = L.order.indexOf(p.id);
    [L.order[a], L.order[b]] = [L.order[b], L.order[a]];
    applyLayout(); saveLayout();
  });
  main.addEventListener('dragend', () => { dragId = null; clearDrop(); });

  // 이전 · 다음 · 제출
  $('prev').onclick = () => go(S.q - 1);
  $('next').onclick = async () => {
    if (S.q < TOTAL - 1) return go(S.q + 1);
    leave();
    const left = TOTAL - answered();
    if (left && !(await ask(`아직 ${left}문제를 풀지 않았습니다. 제출할까요?`, '제출하기'))) return;
    S.screen = 'result'; exitFull(); render();
  };
  $('quit').onclick = async () => { if (await ask('시험을 그만둘까요? 입력한 답은 사라집니다.', '나가기')) goHome(); };

  $('stt').textContent = B.title; applyLayout();
  inp.value = S.drafts[S.b]; drawTree(); drawAtt(); setTab(S.tab); showFile(S.file[S.b]); drawMsgs(); drawQ(); syncGuard();
}

function result() {
  let total = 0;
  const rows = BUNDLES.map((B, bi) => {
    const marks = B.questions.map((q, qi) => isCorrect(q, S.answers[`${bi}-${qi}`]));
    const n = marks.filter(Boolean).length; total += n;
    return { B, bi, marks, n };
  });
  const show = (q, a) => a == null || a === '' ? '미응답' : q.type === 'mc' ? q.options[a] : a;
  const pen = penalty(), failed = pen >= FAIL_AT, final = failed ? 0 : Math.max(0, total - pen);
  return shell('결과 — AI 역량 모의시험', page('결과.md', 'md', `
    <div class="sum">
      <div><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tr" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52" stroke-dasharray="${(2 * Math.PI * 52).toFixed(1)}" stroke-dashoffset="${(2 * Math.PI * 52 * (1 - final / TOTAL)).toFixed(1)}"/></svg>
        ${failed ? `<div class="score fail">탈락</div>` : `<div class="score">${final}<small> / ${TOTAL}</small></div>`}</div>
        <p class="lead">정답 ${total}개${pen ? `<br><span class="pen">화면 이탈 ${S.exits}회 · 감점 ${pen}점${failed ? ' · 자동 탈락' : ''}</span>` : ''}</p></div>
      <div class="bars">${rows.map((r) => `<div class="bar"><span>${esc(r.B.title)}</span><i><b style="width:${r.n / 3 * 100}%"></b></i><span class="mono">${r.n}/3</span></div>`).join('')}</div>
    </div>
    <h2>문제별 해설</h2>
    ${rows.map((r) => r.B.questions.map((q, qi) => `<div class="review">
      <span class="${r.marks[qi] ? 'ok' : 'no'}">${r.marks[qi] ? '✓ 정답' : '✗ 오답'}</span> <span class="qno">문제 ${r.bi * 3 + qi + 1}</span>
      <div class="qt">${esc(q.text)}</div>
      <p>내 답: ${esc(show(q, S.answers[`${r.bi}-${qi}`]))} / 정답: ${esc(q.type === 'mc' ? q.options[q.answer] : q.answers[0])}</p>
      <p>${esc(q.why)}</p></div>`).join('')).join('')}
    <button class="btn start" style="margin-top:24px" data-act="home">처음으로</button>`),
  `<span>${failed ? '탈락' : `점수 ${final}/${TOTAL}`}</span><span class="sp"></span>`);
}

render();
</script>
</body>
</html>
